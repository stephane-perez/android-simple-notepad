name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # On a tag push (v1.2.3), versionName = "1.2.3" so it matches the GitHub Release
      # name exactly. Otherwise (plain push/PR), it's a clearly-marked dev build.
      # versionCode always uses the run number so it strictly increases build to build.
      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "Building version $VERSION_NAME (code ${GITHUB_RUN_NUMBER})"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: >
          ./gradlew assembleDebug --no-daemon
          -PversionNameOverride=${{ steps.version.outputs.version_name }}
          -PversionCodeOverride=${{ steps.version.outputs.version_code }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/angerona-notepad.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: angerona-notepad-apk
          path: app/build/outputs/apk/debug/angerona-notepad.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: angerona-notepad-apk
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/angerona-notepad.apk
          generate_release_notes: true
